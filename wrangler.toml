# Cloudflare Worker: static game files + online rooms (Durable Objects).
# Deploy with `npx wrangler deploy` (or connect the repo in the Cloudflare
# dashboard: Workers & Pages -> Create -> Import a repository).
name = "carcassonne"
main = "worker/index.js"
compatibility_date = "2025-09-01"
# Only reachable on the custom domain (which sits behind Cloudflare Access);
# the workers.dev address and preview URLs are switched off so Access can't be bypassed.
workers_dev = false
preview_urls = false
routes = [{ pattern = "carcassonne.colegates.co.uk", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
